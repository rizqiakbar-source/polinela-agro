version: '3.8'

services:
  # ============================================
  # Aplikasi PHP + Apache
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polinela-agro-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./writable:/var/www/html/writable
    environment:
      CI_ENVIRONMENT: production
      app.baseURL: "http://localhost:8080/"
      database.default.hostname: db
      database.default.database: polinela_agro
      database.default.username: root
      database.default.password: polinela_secret
      database.default.DBDriver: MySQLi
      database.default.port: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - polinela-net

  # ============================================
  # Database MariaDB
  # ============================================
  db:
    image: mariadb:10.11
    container_name: polinela-agro-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: polinela_secret
      MYSQL_DATABASE: polinela_agro
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polinela-net

  # ============================================
  # phpMyAdmin (Development Only)
  # ============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: polinela-agro-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: polinela_secret
    depends_on:
      - db
    networks:
      - polinela-net

volumes:
  db_data:
    driver: local

networks:
  polinela-net:
    driver: bridge
